# Sekans TEST — host nginx vhost (/etc/nginx/sites-available/sekans.conf)
# Once HTTP olarak kurulur; sertifika alindiktan sonra setup.sh 443 blogunu ekler.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sekans.65-21-234-84.sslip.io 65.21.234.84 _;

    # Let's Encrypt dogrulamasi
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /opt/sekans/webroot;
    index index.html;
    client_max_body_size 64m;

    # API -> php konteyneri
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Statik medya uzun cache.
    # Guvenli: bu dosyalarin adlari icerige gore hash'lidir (index-AbC123.js),
    # icerik degisince ad da degisir. Bayat surum servis edilemez.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|gif|pdf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html ASLA cache'lenmez.
    #
    # Neden: varlik adlari hash'li oldugu icin hangi JS/CSS'in yuklenecegini
    # SADECE index.html soyler. Bu dosya cache'lenirse tarayici, sunucudaki yeni
    # surumden habersiz eski varlik adlarini istemeye devam eder; site "gec
    # guncellenmis" gorunur ve hangi surume bakildigi anlasilamaz. (Gizli
    # pencere de her zaman yardimci olmaz: yeni pencere yeni bir cache demek
    # degildir, ayrica ara katmanlar da cache'leyebilir.)
    #
    # Once bu baslik yoktu; nginx cache basligi vermeyince tarayicilar kendi
    # tahminleriyle (heuristic) cache'liyordu.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # SPA geri donusu — bilinmeyen yollar index.html'e duser, o da cache'lenmez.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }
}
